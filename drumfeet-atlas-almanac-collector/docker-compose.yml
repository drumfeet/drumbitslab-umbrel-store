services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-atlas-almanac-collector_web_1
      APP_PORT: 3220
  data_init:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.1.4@sha256:6b726a3c648363409a82caa0f42a6307905e3206eddf56bf8ad859915bb93270
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  web:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.1.4@sha256:6b726a3c648363409a82caa0f42a6307905e3206eddf56bf8ad859915bb93270
    depends_on:
      data_init:
        condition: service_completed_successfully
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PUBLIC_ORIGIN: https://collector.fizzlesmusic.com
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--loglevel", "warn", "run", "--token-file", "/tunnel/token"]
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/tunnel:/tunnel:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
