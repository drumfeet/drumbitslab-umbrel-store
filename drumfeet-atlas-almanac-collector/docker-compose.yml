services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-atlas-almanac-collector_web_1
      APP_PORT: 3220
  data_init:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.5.3@sha256:5a4d86b5a1558ac38dd5b1b58035994d4433386f9099c4745a58458c78f52e59
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  web:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.5.3@sha256:5a4d86b5a1558ac38dd5b1b58035994d4433386f9099c4745a58458c78f52e59
    depends_on:
      data_init:
        condition: service_completed_successfully
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PUBLIC_ORIGIN: https://collector.fizzlesmusic.com
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--loglevel", "warn", "run", "--token-file", "/tunnel/token"]
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/tunnel:/tunnel:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
