services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-atlas-almanac-collector_web_1
      APP_PORT: 3220
  data_init:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.1.0@sha256:883fbaaf54faa8fae629904e0dfc62edf66cd845553c67bc1ec8a99afa082708
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  web:
    image: ghcr.io/drumfeet/atlas-almanac-collector:0.1.0@sha256:883fbaaf54faa8fae629904e0dfc62edf66cd845553c67bc1ec8a99afa082708
    depends_on:
      data_init:
        condition: service_completed_successfully
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PUBLIC_ORIGIN: https://umbrel-1.taile58726.ts.net:8443
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
