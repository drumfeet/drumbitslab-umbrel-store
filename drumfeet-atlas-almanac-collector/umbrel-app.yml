manifestVersion: 1
id: drumfeet-atlas-almanac-collector
name: Atlas Almanac Collector
tagline: Collect and publish data for Atlas Almanac
icon: https://raw.githubusercontent.com/drumfeet/drumbitslab-umbrel-store/main/drumfeet-atlas-almanac-collector/icon.svg
category: Utilities
version: "0.5.17"
port: 3221
description: >-
  Requires an AMD64 Umbrel device.
  Collects daily prices for 283 Philippine stock listings using Phisix with a PSEye fallback.
  Reads six Philippine government bond yields from TradingView.
  Publishes current values to private R2 storage for Atlas Almanac and its Telegram and Viber reports.
  Credentials and schedule controls stay on Umbrel.
developer: DrumbitsLab
website: https://github.com/drumfeet/atlas-almanac-collector
submitter: DrumbitsLab
submission: https://github.com/drumfeet/atlas-almanac-collector
repo: https://github.com/drumfeet/atlas-almanac-collector
support: https://github.com/drumfeet/atlas-almanac-collector/issues
gallery: []
releaseNotes: >-
  Publishes the latest stock and bond snapshots through the existing Atlas Worker.
  Configure the publication credential on both services before switching transports.
  Upgrade notes
  https://github.com/drumfeet/drumbitslab-umbrel-store/blob/main/docs/releases/2026-11-22-atlas-0.5.17.md
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
