gallery: []
releaseNotes: >-
  Cloudflare Tunnel 2026.11.2 fixes an Access policy bypass and limits
  the debug endpoints on the connector's metrics server.
  Release notes
  https://github.com/drumfeet/drumbitslab-umbrel-store/blob/main/docs/releases/2026-11-27-atlas-0.5.20.md
