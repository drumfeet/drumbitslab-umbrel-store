manifestVersion: 1
id: drumfeet-atlas-almanac-collector
name: Atlas Almanac Collector
tagline: Collect and publish data for Atlas Almanac
icon: https://raw.githubusercontent.com/drumfeet/drumbitslab-umbrel-store/main/drumfeet-atlas-almanac-collector/icon.svg
category: Utilities
version: "0.4.9"
port: 3221
description: >-
  Requires an AMD64 Umbrel device.
  Collect Philippine bond yields from TradingView and publish validated snapshots to Atlas Almanac.
  Runs at 21:20 UTC on weekdays, with bounded retries and publication checks.
  Keeps credentials on your Umbrel and shows connection, schedule and publication status.
  Uses the owner's Cloudflare Access-protected HTTPS hostname and a repository-scoped GitHub token.
  Scheduling starts paused. Telegram and Viber delivery remains in Atlas Almanac.
developer: DrumbitsLab
website: https://github.com/drumfeet/atlas-almanac-collector
submitter: DrumbitsLab
submission: https://github.com/drumfeet/atlas-almanac-collector
repo: https://github.com/drumfeet/atlas-almanac-collector
support: https://github.com/drumfeet/atlas-almanac-collector/issues
gallery: []
releaseNotes: >-
  Retains safe per-symbol stock failure evidence across retries and restarts,
  including request bounds and transport diagnostics. Shows verified recovery
  in dashboard details and the private Atlas diagnostic reader. Preserves
  schedules, source selection, retry policy and archive receipts.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
