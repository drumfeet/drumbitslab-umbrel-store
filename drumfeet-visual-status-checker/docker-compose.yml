version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-visual-status-checker_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/drumfeet/visual-status-checker:0.1.19@sha256:9d3561f720c0cdc923d116b3be8e5254bb507e315188921701eca7ff9b261c3b
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      MINIMUM_CHECK_INTERVAL_MS: "900000"
