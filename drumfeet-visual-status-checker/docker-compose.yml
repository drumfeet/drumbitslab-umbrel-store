version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-visual-status-checker_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/drumfeet/visual-status-checker:0.1.12@sha256:fb2aedbc503878b8b2e9759be3e9c4f38252ed370e1de21a6e763611c066e41a
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      MINIMUM_CHECK_INTERVAL_MS: "900000"
