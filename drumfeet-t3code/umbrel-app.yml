manifestVersion: 1
id: drumfeet-t3code
name: T3 Code Nightly
icon: https://raw.githubusercontent.com/drumfeet/drumbitslab-umbrel-store/main/drumfeet-t3code/icon.svg
tagline: Run coding agents on Umbrel from your Mac
category: Developer Tools
version: "0.1.1"
port: 3218
description: >-
  AMD64 only. Run the official T3 Code nightly server on Umbrel and connect
  from T3 Code Desktop. The setup page creates local pairing links and walks
  you through T3 Connect sign-in for access away from home. Bring your own
  coding-provider accounts. Nightly server updates are applied from T3 Code's
  update controls and persist across container restarts. Updates interrupt
  active work. The app stores projects and credentials in its own data directory.
developer: DrumbitsLab
website: https://t3.codes
submitter: DrumbitsLab
submission: https://github.com/drumfeet/t3code-umbrel
repo: https://github.com/drumfeet/t3code-umbrel
support: https://github.com/drumfeet/t3code-umbrel/issues
gallery: []
releaseNotes: >-
  Container maintenance refresh with validated nightly compatibility and persistence.
  Updates the package without resetting your projects or T3 Connect preference.
