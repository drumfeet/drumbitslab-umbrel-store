services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-t3code_server_1
      APP_PORT: 3000
  server:
    image: ghcr.io/drumfeet/t3code-umbrel:0.1.1@sha256:dc03013b3fde79ba153179e3160b2802f47e0b8a21760ed938f22ae36437787d
    restart: on-failure
    stop_grace_period: 45s
    ports:
      - "3773:3773"
    environment:
      SETUP_HOSTS: ${DEVICE_DOMAIN_NAME},${DEVICE_HOSTNAME},localhost,127.0.0.1
      T3_LAN_ORIGIN: http://${DEVICE_DOMAIN_NAME}:3773
    volumes:
      - ${APP_DATA_DIR}/data:/data
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
