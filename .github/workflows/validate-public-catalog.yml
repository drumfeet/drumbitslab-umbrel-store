name: Validate public catalog

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/verify-public-catalog.sh
      - name: Test publication guard and installable app packages
        run: |
          python3 -m venv "$RUNNER_TEMP/catalog-tests"
          "$RUNNER_TEMP/catalog-tests/bin/python" -m pip install -r tests/requirements.txt
          "$RUNNER_TEMP/catalog-tests/bin/python" -B -m unittest discover -s tests -p 'test_*.py' -v
