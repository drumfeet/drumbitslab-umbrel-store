name: Validate public catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/verify-public-catalog.sh
      - name: Test catalog publication guard
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
