name: Check published T3 package updates
on:
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-catalog-update
  cancel-in-progress: false
jobs:
  prepare-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare a catalog PR from published public image metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/t3-update.py
