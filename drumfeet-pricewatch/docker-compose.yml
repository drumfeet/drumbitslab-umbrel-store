services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-pricewatch_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/drumfeet/pricewatch:0.1.16@sha256:6efa569a9403c6fe6bc77eed3c2ad7e4487fb727d6a56bbbdf8a391af3244588
    security_opt:
      - apparmor=drumfeet-pricewatch
      - seccomp=${APP_DATA_DIR}/seccomp.json
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ALLOW_PRIVATE_HOSTS: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,${DEVICE_DOMAIN_NAME},drumfeet-pricewatch_web_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    shm_size: 256mb
