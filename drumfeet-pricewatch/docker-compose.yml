services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-pricewatch_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/drumfeet/pricewatch:0.1.19@sha256:6f1a37ba717ecc2ee129f88ef1e92362edf628214cc7b071e272844ef6acd51a
    security_opt:
      - apparmor=drumfeet-pricewatch
      - seccomp=${APP_DATA_DIR}/seccomp.json
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ALLOW_PRIVATE_HOSTS: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,${DEVICE_DOMAIN_NAME},drumfeet-pricewatch_web_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    shm_size: 256mb
