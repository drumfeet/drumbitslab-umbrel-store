services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-pricewatch_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/drumfeet/pricewatch:0.1.31@sha256:0685325d303fbd50c8ba9425ef2fdab4a1b44969e7178886e9d68b799de1080a
    security_opt:
      - apparmor=drumfeet-pricewatch
      - seccomp=${APP_DATA_DIR}/seccomp.json
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ALLOW_PRIVATE_HOSTS: "true"
      LAZADA_HEADED_EXPERIMENT: "0"
      LAZADA_BROWSER_MODE: headed-direct
      LAZADA_QUALIFIED_REVISION: qualification-current-price-v1
      LAZADA_NORMAL_VERIFICATION_REVISION: normal-current-price-v1
      ALLOWED_HOSTS: localhost,127.0.0.1,${DEVICE_DOMAIN_NAME},drumfeet-pricewatch_web_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    shm_size: 256mb
