services:
  app_proxy:
    environment:
      APP_HOST: drumfeet-pricewatch_web_1
      APP_PORT: 3000
  web:
    image: ghcr.io/drumfeet/pricewatch:0.1.28@sha256:ed562beb9e7e74488ad334b9beff368bd6e4fb45557c9540ec756ae09e0a4cb7
    security_opt:
      - apparmor=drumfeet-pricewatch
      - seccomp=${APP_DATA_DIR}/seccomp.json
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ALLOW_PRIVATE_HOSTS: "true"
      LAZADA_HEADED_EXPERIMENT: "1"
      LAZADA_EXPERIMENT_REVISION: diagnostic-price-evidence-v2
      LAZADA_EXPERIMENT_SEED_REVISION: diagnostic-price-evidence-v1
      ALLOWED_HOSTS: localhost,127.0.0.1,${DEVICE_DOMAIN_NAME},drumfeet-pricewatch_web_1
    volumes:
      - ${APP_DATA_DIR}/data:/data
    shm_size: 256mb
