manifestVersion: 1
id: drumfeet-pricewatch
name: Pricewatch
tagline: Track prices and receive alerts when they fall
icon: https://raw.githubusercontent.com/drumfeet/drumbitslab-umbrel-store/main/drumfeet-pricewatch/icon.svg
category: Utilities
version: "0.1.20"
port: 3217
description: >-
  Monitor supported products and flight searches from your Umbrel node.
  View recent prices, configure checks, and receive Telegram or Viber Channel alerts for new lows.
  Track Klook products, Google Flights searches, the Octopus Relax energy rate, and selected Uniqlo products.
  Add and start one product or all remaining products in one action. Google Flights is experimental
  and pauses if Google requires verification or consent.
developer: DrumbitsLab
website: https://github.com/drumfeet/pricewatch
submitter: DrumbitsLab
submission: https://github.com/drumfeet/pricewatch
repo: https://github.com/drumfeet/pricewatch
support: https://github.com/drumfeet/pricewatch/issues
gallery: []
releaseNotes: >-
  Fixes Lazada recovery when its verification page is nested below the luggage
  product URL or begins with a doubled slash. Recovery remains restricted to
  the configured product and Lazada verification routes. Flight confirmation,
  saved prices and paused monitor settings are unchanged.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
